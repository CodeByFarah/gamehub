# ---------------------------------------------------------------------------
# Main branch: verify, build an image, publish it, and prepare a deployment.
#
# Deliberately stops short of deploying. The final step produces a tagged,
# scanned image in Artifact Registry and the exact command to release it. See
# docs/deployment.md for why the last step is manual.
# ---------------------------------------------------------------------------

name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Not cancel-in-progress. A half-finished image publish is worse than a
  # queued one, and main pushes are infrequent enough that queueing is fine.
  group: main
  cancel-in-progress: false

permissions:
  contents: read
  # Required for Workload Identity Federation, which is how this authenticates
  # to Google Cloud without a long-lived service account key.
  id-token: write

env:
  IMAGE_NAME: gamehub-backend

jobs:

  verify:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and verify
        working-directory: backend
        env:
          TESTCONTAINERS_REUSE_ENABLE: 'false'
        # `check` depends on both test tasks, so this is the complete suite.
        # An image is never built from a commit whose tests did not pass.
        run: ./gradlew check --no-daemon

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            backend/build/reports/tests
            backend/build/reports/jacoco
          retention-days: 30

  publish-image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25

    # Skipped entirely when Google Cloud is not configured, so a fork or a
    # clone without secrets gets a green build rather than a confusing
    # authentication failure.
    if: vars.GCP_PROJECT_ID != ''

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation rather than a service account key.
          # There is no long-lived credential to leak, rotate or accidentally
          # commit, which is the whole reason for the extra setup.
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image tags
        id: tags
        run: |
          REGISTRY="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/gamehub"
          # Tagged by commit SHA, not by "latest". A deployment must name an
          # exact immutable artefact, or a rollback has nothing to roll back
          # to. The latest tag is published as well, purely for convenience.
          echo "sha_tag=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.tags.outputs.sha_tag }}" \
            -t "${{ steps.tags.outputs.latest_tag }}" \
            ./backend

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tags.outputs.sha_tag }}
          format: table
          # Build fails on a fixable high or critical finding. Unfixed ones
          # are reported but do not block, because there is nothing to do
          # about them and a permanently red pipeline gets ignored.
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push image
        run: |
          docker push "${{ steps.tags.outputs.sha_tag }}"
          docker push "${{ steps.tags.outputs.latest_tag }}"

      - name: Summarise the release
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.sha_tag }}"
            echo '```'
            echo
            echo "Deploy it with:"
            echo
            echo '```bash'
            echo "gcloud run deploy gamehub-backend \\"
            echo "  --image ${{ steps.tags.outputs.sha_tag }} \\"
            echo "  --region ${{ vars.GCP_REGION }} \\"
            echo "  --project ${{ vars.GCP_PROJECT_ID }}"
            echo '```'
            echo
            echo "Deployment is deliberately manual. See docs/deployment.md."
          } >> "$GITHUB_STEP_SUMMARY"
